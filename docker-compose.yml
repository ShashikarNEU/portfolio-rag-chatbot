services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite chat history across container restarts
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../personal-portfolio
      dockerfile: ../portfolio-rag-chatbot/Dockerfile.frontend
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
